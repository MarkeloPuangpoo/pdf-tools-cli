[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdftoolscli"
version = "0.1.0.dev0"
description = "Fast, safe, offline PDF toolkit for automation and terminal workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "PDF Tools CLI Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1.8",
    "rich>=13.9.4",
    "platformdirs>=4.3.6",
    "psutil>=6.1.1",
    "pikepdf>=9.5.1",
    "pypdfium2>=4.30.1",
    "pillow>=11.1.0",
    "reportlab>=4.3.1",
    "img2pdf>=0.6.0",
]

[project.scripts]
pdftoolscli = "pdftoolscli.cli.main:cli"
ptc = "pdftoolscli.cli.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.124.7",
    "mypy>=1.14.1",
    "ruff>=0.9.4",
    "pypdf>=5.2.0",
    "types-psutil>=6.1.0.20241221",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdftoolscli"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_unused_configs = true
packages = ["pdftoolscli"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "pypdfium2.*",
    "reportlab.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
